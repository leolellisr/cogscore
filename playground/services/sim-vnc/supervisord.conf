[supervisord]
nodaemon=true

[program:xvfb]
command=Xvfb :1 -screen 0 1600x900x24
autorestart=true
priority=10

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":1"
autorestart=true
priority=20

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -rfbport 5901 -passwd %(ENV_VNC_PASSWORD)s
autorestart=true
priority=30

[program:novnc]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5901
autorestart=true
priority=40
